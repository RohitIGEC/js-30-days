<!DOCTYPE html>
<html>
<head>
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calc">
        <div class="screen">
            <div class="expr" id="expr"></div>
            <div class="num" id="display">0</div>
        </div>
        <div class="grid">
            <button class="btn gray" onclick="ac()">AC</button>
            <button class="btn gray" onclick="sign()">+/-</button>
            <button class="btn gray" onclick="pct()">%</button>
            <button class="btn orange" onclick="op('/')">÷</button>
            <button class="btn dark" onclick="num('7')">7</button>
            <button class="btn dark" onclick="num('8')">8</button>
            <button class="btn dark" onclick="num('9')">9</button>
            <button class="btn orange" onclick="op('×')">×</button>
            <button class="btn dark" onclick="num('4')">4</button>
            <button class="btn dark" onclick="num('5')">5</button>
            <button class="btn dark" onclick="num('6')">6</button>
            <button class="btn orange" onclick="op('−')">−</button>
            <button class="btn dark" onclick="num('1')">1</button>
            <button class="btn dark" onclick="num('2')">2</button>
            <button class="btn dark" onclick="num('3')">3</button>
            <button class="btn orange" onclick="op('+')">+</button>
            <button class="btn dark zero" onclick="num('0')">0</button>
            <button class="btn dark" onclick="dot()">.</button>
            <button class="btn orange" onclick="eq()">=</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
